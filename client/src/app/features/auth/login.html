<div class="row justify-content-center">
  <div class="col-12 col-sm-8 col-md-5">
    <h1 class="h4 mb-3">{{ 'login.title' | t }}</h1>

    @if (notice(); as noticeKey) {
      <div class="alert alert-info" role="status" data-testid="login-notice">{{ noticeKey | t }}</div>
    }

    @if (error(); as errorKey) {
      <div class="alert alert-danger" role="alert" aria-live="assertive" data-testid="login-error">{{ errorKey | t }}</div>
    }

    @if (challenge() === null) {
      <form (ngSubmit)="submitCredentials()" novalidate data-testid="credentials-form">
        <div class="mb-3">
          <label class="form-label" for="userNameOrEmail">{{ 'login.userNameOrEmail' | t }}</label>
          <input class="form-control" id="userNameOrEmail" name="userNameOrEmail" autocomplete="username" required
                 [(ngModel)]="userNameOrEmail" [disabled]="busy()" />
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">{{ 'login.password' | t }}</label>
          <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required
                 [(ngModel)]="password" [disabled]="busy()" />
        </div>
        <button class="btn btn-primary w-100" type="submit" [disabled]="busy()" data-testid="login-submit">
          {{ 'login.submit' | t }}
        </button>
      </form>
    } @else {
      <form (ngSubmit)="submitCode()" novalidate data-testid="mfa-form">
        <h2 class="h6">{{ 'login.mfa.title' | t }}</h2>
        <div class="mb-3">
          <label class="form-label" for="code">{{ 'login.mfa.code' | t }}</label>
          <input class="form-control" id="code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required
                 [(ngModel)]="code" [disabled]="busy()" />
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-outline-secondary" type="button" (click)="back()" [disabled]="busy()">{{ 'login.mfa.back' | t }}</button>
          <button class="btn btn-primary flex-grow-1" type="submit" [disabled]="busy()" data-testid="mfa-submit">{{ 'login.mfa.submit' | t }}</button>
        </div>
      </form>
    }
  </div>
</div>
